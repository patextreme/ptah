[package]
name = "ptah-cli"
version = "0.1.0"
edition = "2024"
description = "Luau-scripted multi-agent orchestration over the Agent Client Protocol"
license = "MIT"

[lints]
workspace = true

# The library name survives the workspace split: `ptah` is this crate's
# permanent public facade (tests and downstream code exercise the system
# through `ptah::*`), not a transitional shim.
[lib]
name = "ptah"
path = "src/lib.rs"

[[bin]]
name = "ptah"
path = "src/main.rs"

# Test fixture: a scriptable ACP agent used by the integration test suite.
# Not part of the user-facing CLI surface.
[[bin]]
name = "mock-agent"
path = "src/bin/mock-agent/main.rs"

[dependencies]
ptah-core = { path = "../ptah-core" }
ptah-acp = { path = "../ptah-acp" }
ptah-check = { path = "../ptah-check" }
ptah-config = { path = "../ptah-config" }
ptah-luau = { path = "../ptah-luau" }
ptah-pesde = { path = "../ptah-pesde" }
ptah-render = { path = "../ptah-render" }
ptah-result = { path = "../ptah-result" }
agent-client-protocol = { workspace = true }
# Injected into the package-management driver (ptah-pesde takes a
# client by design).
reqwest = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
mlua = { workspace = true }
tempfile = { workspace = true }
# Fixture builders (git repositories, registry indices) for the
# offline package-management e2e tests.
ptah-pesde = { path = "../ptah-pesde", features = ["test-fixtures"] }
# Gzipping fixture package tarballs for the loopback registry (already
# in the tree via pesde's async-compression).
flate2 = "1"
